<title>Aula de Español</title>
<meta name="description" content="تمارين الإسبانية من A1 حتى C1، بالشرح بالدارجة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #EEF2F8;
  --surface: #FFFFFF;
  --surface-2: #E4EAF4;
  --ink: #14213D;
  --muted: #5B6B85;
  --line: #D3DCE9;
  --accent: #1F4FA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE6F8;
  --sun: #E8A817;
  --sun-soft: #FCEFCB;
  --good: #1B7F52;
  --good-soft: #D6F0E2;
  --bad: #B83A33;
  --bad-soft: #F8DCDA;
  --radius: 14px;
  --display: "Bricolage Grotesque", "Readex Pro", system-ui, sans-serif;
  --body: "Readex Pro", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1422; --surface: #16203A; --surface-2: #1D2946; --ink: #E7EDF8; --muted: #98A8C3;
    --line: #283655; --accent: #86A9F2; --accent-ink: #0D1422; --accent-soft: #22335A;
    --sun: #F2C14E; --sun-soft: #3A3120; --good: #5BC994; --good-soft: #173A2B; --bad: #F08A83; --bad-soft: #43201F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1422; --surface: #16203A; --surface-2: #1D2946; --ink: #E7EDF8; --muted: #98A8C3;
  --line: #283655; --accent: #86A9F2; --accent-ink: #0D1422; --accent-soft: #22335A;
  --sun: #F2C14E; --sun-soft: #3A3120; --good: #5BC994; --good-soft: #173A2B; --bad: #F08A83; --bad-soft: #43201F;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65;
  padding-inline: 16px; padding-block: 0 48px;
}
#app { max-width: 680px; margin-inline: auto; }
.es { font-family: var(--display); direction: ltr; unicode-bidi: isolate; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }

/* header */
.top { padding-block: 28px 18px; display: flex; flex-direction: column; gap: 6px; }
.brand { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 42px); letter-spacing: -0.02em; direction: ltr; text-align: right; }
.brand .mark { color: var(--sun); }
.sub { color: var(--muted); margin: 0; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.meter .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }

/* levels */
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; direction: ltr; margin-block: 8px 20px; }
.lvl { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.lvl b { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.1; }
.lvl span { font-family: var(--display); font-size: 12px; color: var(--muted); }
.lvl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lvl[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.lvl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.lvl-head h2 { font-size: 20px; font-weight: 600; }
.lvl-head small { color: var(--muted); font-size: 13px; }

/* lesson list */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; width: 100%; }
.row:hover { border-color: var(--accent); }
.num { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.row .t { display: flex; flex-direction: column; min-width: 0; }
.row .t .es { font-weight: 700; font-size: 17px; text-align: right; }
.row .t small { color: var(--muted); font-size: 13.5px; }
.pill { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.new { background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--sun-soft); color: var(--ink); }
.row.mine .num { color: var(--sun); }
.add-row { margin-top: 14px; border: 1.5px dashed var(--line); background: transparent; border-radius: var(--radius); padding: 14px; width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: right; }
.add-row b { color: var(--accent); font-weight: 600; }
.add-row small { color: var(--muted); }

/* generic */
.back { background: none; border: 0; color: var(--muted); padding: 22px 0 8px; font-size: 15px; }
.back:hover { color: var(--accent); }
.eyebrow { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); direction: ltr; text-align: right; }
.lesson-title { font-family: var(--display); font-size: clamp(26px, 7vw, 34px); font-weight: 800; letter-spacing: -0.01em; direction: ltr; text-align: right; }
.lesson-ar { color: var(--muted); margin: 2px 0 18px; }
.tg { display: inline-block; margin: -8px 0 16px; color: var(--accent); font-weight: 500; font-size: 15px; text-decoration: none; border-bottom: 1.5px solid var(--accent-soft); }
.tg:hover { border-bottom-color: var(--accent); }
.note { background: var(--sun-soft); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.note h3 { font-size: 15px; font-weight: 600; }
.note p { margin: 0; }
.note .es { font-weight: 700; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
h3.sec { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.vocab { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.vrow { display: grid; grid-template-columns: 40px 1fr 1fr; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
.vrow:first-child { border-top: 0; }
.vrow .es { font-weight: 600; text-align: left; }
.vrow .ar { color: var(--muted); font-size: 15px; }
.say { width: 32px; height: 32px; border-radius: 99px; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.say svg { width: 16px; height: 16px; }

/* quiz */
.qtop { display: flex; align-items: center; gap: 12px; padding-block: 22px 18px; }
.qtop .close { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 0; }
.qtop .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.qtop .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qtop .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; direction: ltr; }
.kind { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.prompt { font-size: clamp(22px, 6vw, 28px); font-weight: 700; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.prompt.es { justify-content: flex-end; }
.prompt .blank { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--sun); margin-inline: 4px; color: var(--accent); text-align: center; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 16px; text-align: right; font-size: 17px; }
.opt.es { text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.slots { min-height: 58px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; margin-bottom: 18px; direction: ltr; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; direction: ltr; }
.tok { background: var(--surface); border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 10px; padding: 7px 13px; font-family: var(--display); font-size: 17px; font-weight: 600; }
.tok.used { visibility: hidden; }
.feedback { position: sticky; bottom: 0; margin-top: 24px; border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { font-size: 17px; }
.feedback .good-t { color: var(--good); }
.feedback .bad-t { color: var(--bad); }
.check { margin-top: 24px; width: 100%; }

/* flashcards */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; min-height: 230px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; width: 100%; margin-bottom: 14px; }
.card .front { font-family: var(--display); font-size: clamp(28px, 8vw, 38px); font-weight: 800; direction: ltr; }
.card .back-t { font-size: 22px; color: var(--accent); }
.card small { color: var(--muted); }

/* result */
.result { text-align: center; padding-block: 40px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; direction: ltr; font-variant-numeric: tabular-nums; }
.score small { font-size: 26px; color: var(--muted); }
.result p { color: var(--muted); margin: 0; }
.review { margin-top: 18px; width: 100%; text-align: right; }

/* form */
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 15px; }
.form input, .form textarea, .form select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; width: 100%; }
.form textarea { min-height: 220px; direction: ltr; text-align: left; line-height: 1.8; font-family: var(--display); }
.help { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 14.5px; color: var(--muted); }
.help code { font-family: var(--display); color: var(--ink); direction: ltr; unicode-bidi: isolate; }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.danger { background: none; border: 0; color: var(--bad); font-size: 14px; padding: 8px 0; }
/* practice */
.pic { font-size: 88px; line-height: 1.15; text-align: center; margin: 4px 0 20px; }
.pic.num { font-family: var(--display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.answer-form { display: flex; flex-direction: column; gap: 10px; }
.answer-input { font: inherit; font-family: var(--display); font-size: 20px; direction: ltr; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; resize: vertical; }
.answer-input.right { border-color: var(--good); background: var(--good-soft); }
.answer-input.wrong { border-color: var(--bad); background: var(--bad-soft); }
.keys { display: flex; flex-wrap: wrap; gap: 5px; direction: ltr; }
.key { background: var(--surface-2); border: 0; border-radius: 8px; min-width: 33px; padding: 4px 6px; font-family: var(--display); font-size: 17px; }
.key:hover { background: var(--accent-soft); }
.diff mark { background: var(--sun-soft); color: var(--bad); border-radius: 3px; text-decoration: underline; text-underline-offset: 3px; }
.row-say { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-say .es { font-size: 18px; }
.hint { color: var(--muted); font-size: 14px; }
.listen { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 4px 0 20px; }
.listen-btn { width: 88px; height: 88px; border-radius: 99px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.listen-btn svg { width: 38px; height: 38px; }
.feedback.self, .feedback.wait { background: var(--surface); border: 1.5px solid var(--line); }
.btn.talk { grid-column: 1 / -1; background: var(--sun); color: #1b1606; display: flex; flex-direction: column; align-items: center; gap: 0; }
.btn.talk small { font-weight: 400; font-size: 13px; opacity: .8; }
/* chat */
.chat-title { flex: 1; text-align: left; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-title b { color: var(--ink); }
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 170px; }
.bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; display: flex; flex-direction: column; gap: 6px; }
.bubble p { margin: 0; }
.bubble .es { font-size: 17px; text-align: left; }
.bubble.tutor { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-start-start-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-start-end-radius: 6px; }
.bubble-tools { display: flex; align-items: center; gap: 10px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; }
.tr { color: var(--muted); font-size: 15px; }
.fix { align-self: flex-end; max-width: 86%; border-radius: 12px; padding: 8px 12px; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; margin-top: -4px; }
.fix.good { background: var(--good-soft); } .fix.good b { color: var(--good); }
.fix.bad { background: var(--sun-soft); } .fix.bad b { color: var(--bad); }
.typing { flex-direction: row; gap: 5px; padding: 14px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 99px; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer-in { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-form { display: flex; gap: 8px; }
.chat-form .answer-input { font-size: 17px; padding: 11px 13px; }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) { .levels { gap: 5px; } .lvl b { font-size: 19px; } .vrow { grid-template-columns: 36px 1fr; } .vrow .ar { grid-column: 2; margin-top: -6px; } }
</style>

<main id="app" dir="rtl" lang="ar"></main>

<script>

/* ============ التصحيح ============ */
const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const clean = s => s.toLowerCase().replace(/[¿?¡!.,;:«»"()]/g, " ").replace(/\s+/g, " ").trim();
const noArt = s => s.replace(/^(el|la|los|las|un|una|unos|unas)\s+/, "");
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function judge(input, expected) {
  const a = clean(input), e = clean(expected);
  if (a === e) return { ok: true };
  if (noArt(a) === noArt(e)) return { ok: true, note: "article" };
  if (deacc(a) === deacc(e) || deacc(noArt(a)) === deacc(noArt(e))) return { ok: true, note: "accent" };
  const dist = lev(deacc(noArt(a)), deacc(noArt(e)));
  return { ok: false, near: dist <= (e.length > 6 ? 2 : 1) };
}
// كيلون فالجواب الصحيح الحروف اللي غلطتي فيهم ولا نسيتيهم
function diffHTML(input, expected) {
  const a = [...clean(input)], e = [...expected];
  const el = e.map(c => c.toLowerCase());
  const L = Array.from({ length: e.length + 1 }, () => new Array(a.length + 1).fill(0));
  for (let i = e.length - 1; i >= 0; i--) for (let j = a.length - 1; j >= 0; j--)
    L[i][j] = el[i] === a[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < e.length) {
    if (j < a.length && el[i] === a[j]) { out += esc(e[i]); i++; j++; }
    else if (j < a.length && L[i][j + 1] >= L[i + 1][j]) j++;
    else { out += /[\s¿?¡!.,]/.test(e[i]) ? esc(e[i]) : `<mark>${esc(e[i])}</mark>`; i++; }
  }
  return out;
}

/* ============ الدروس ديالك (من الفيديو) ============ */
function parseMine(text) {
  const vocab = [], build = [];
  text.split("\n").forEach(line => {
    const i = line.indexOf("=");
    if (i < 0) return;
    const es = line.slice(0, i).trim(), ar = line.slice(i + 1).trim();
    if (!es || !ar) return;
    (es.split(/\s+/).length >= 3 ? build : vocab).push([es, ar]);
  });
  const words = uniq(vocab.map(v => v[0]).concat(build.flatMap(b => b[0].split(/\s+/).map(w => w.replace(/[¿?¡!.,;:]/g, "")))).filter(Boolean));
  const fill = [];
  build.forEach(([es]) => {
    const toks = es.split(/\s+/);
    let k = 0;
    toks.forEach((t, j) => { if (t.replace(/[¿?¡!.,;:]/g, "").length > toks[k].replace(/[¿?¡!.,;:]/g, "").length) k = j; });
    const ans = toks[k].replace(/[¿?¡!.,;:]/g, "");
    const d = shuffle(words.filter(w => w.toLowerCase() !== ans.toLowerCase())).slice(0, 3);
    if (d.length) fill.push([toks.map((t, j) => j === k ? t.replace(ans, "___") : t).join(" "), ans, d]);
  });
  return { vocab, build, fill };
}

/* ============ التمارين ============ */
function makeQuiz(lesson) {
  const sameLevel = lessonsOf(lesson.level).flatMap(l => l.vocab || []);
  const pool = (lesson.vocab || []).concat(sameLevel);
  const pick = (field, not) => shuffle(uniq(pool.map(p => p[field]).filter(x => x !== not))).slice(0, 3);
  const v = shuffle((lesson.vocab || []).slice());
  const withPic = v.filter(x => picFor(lesson, x[0]));
  const noPic = v.filter(x => !picFor(lesson, x[0]));
  const qs = [];
  // الكتابة: شوف التصويرة وكتب السمية / كتب بالإسبانية / سمع وكتب
  withPic.slice(0, 3).forEach(([es, ar]) => qs.push({ type: "name", kind: "شنو سمية هادي بالإسبانية؟", pic: picFor(lesson, es), answer: es, ar }));
  noPic.slice(0, withPic.length >= 3 ? 1 : 3 - withPic.length).forEach(([es, ar]) => qs.push({ type: "type", kind: "كتب هادي بالإسبانية", q: ar, answer: es, ar }));
  const listenSrc = shuffle((lesson.build || []).concat(v.slice(0, 3)))[0];
  if (listenSrc) qs.push({ type: "listen", kind: "سمع وكتب اللي سمعتي", answer: listenSrc[0], ar: listenSrc[1] });
  // الاختيار
  v.slice(0, 2).forEach(([es, ar]) => qs.push({ type: "mcq", kind: "شنو معنى هاد الكلمة؟", q: es, qEs: true, answer: ar, options: shuffle([ar, ...pick(1, ar)]), optEs: false }));
  shuffle((lesson.fill || []).slice()).slice(0, 2).forEach(([s, a, d]) => qs.push({ type: "fill", kind: "عمّر الفراغ", q: s, answer: a, options: shuffle([a, ...d]), optEs: true }));
  shuffle((lesson.build || []).slice()).slice(0, 1).forEach(([es, ar]) => qs.push({ type: "build", kind: "رتب الكلمات باش تكتب الجملة", q: ar, answer: es, tokens: shuffle(es.split(/\s+/).map((t, i) => ({ t, i }))) }));
  const main = shuffle(qs).slice(0, 10);
  // فالخر: جاوب على سؤال بحال فالهضرة
  asksOf(lesson).forEach(([q, hint, example]) => main.push({ type: "ask", kind: "جاوب على السؤال بجملة كاملة", q, hint, example }));
  return main;
}

    <span>قارن الجواب ديالك مع هاد المثال:</span>

    ${quiz.answered ? `<button class="btn" data-act="next">${quiz.i === quiz.qs.length - 1 ? "شوف النتيجة" : "كمل"}</button>`
      : `<div class="actions" style="margin:0"><button class="btn" data-act="self" data-ok="1">جاوبت صحيح</button><button class="btn ghost" data-act="self" data-ok="0">كان عندي غلط</button></div>`}</div>`;
}

function renderQuiz() {
  const q = quiz.qs[quiz.i];
  const n = quiz.qs.length;
  const progress = Math.round((quiz.i + (quiz.answered ? 1 : 0)) / n * 100);
  const nextBtn = `<button class="btn" data-act="next">${quiz.i === n - 1 ? "شوف النتيجة" : "كمل"}</button>`;
  let body = "", fb = "";
  if (q.type === "mcq" || q.type === "fill") {
    let prompt;
    if (q.type === "fill") {
      const filled = quiz.answered ? `<span class="blank">${esc(q.answer)}</span>` : '<span class="blank">&nbsp;</span>';
      prompt = `<div class="prompt es" lang="es"><span>${esc(q.q).replace("___", filled)}</span></div>`;
    } else {
      prompt = `<div class="prompt ${q.qEs ? "es" : ""}" ${q.qEs ? 'lang="es"' : ""}>${q.qEs ? `<button class="say" data-act="say" data-t="${esc(q.q)}" aria-label="سمع">${SPEAK}</button>` : ""}<span>${esc(q.q)}</span></div>`;
    }
    body = prompt + `<div class="opts">${q.options.map((o, i) => {
      let cls = "";
      if (quiz.answered) { if (o === q.answer) cls = "right"; else if (i === quiz.picked) cls = "wrong"; }
      return `<button class="opt ${q.optEs ? "es" : ""} ${cls}" ${q.optEs ? 'lang="es"' : ""} data-act="pick" data-i="${i}" ${quiz.answered ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
    if (quiz.answered) fb = quiz.ok
      ? `<div class="feedback good" role="status"><b class="good-t">صحيح! مزيان</b>${nextBtn}</div>`
      : `<div class="feedback bad" role="status"><b class="bad-t">ماشي هي هادي</b><span>الجواب الصحيح: <b ${q.optEs === false ? "" : 'class="es" lang="es"'}>${esc(q.answer)}</b></span>${nextBtn}</div>`;
  } else if (q.type === "build") {
    body = `<div class="prompt">${esc(q.q)}</div>
      <div class="slots" lang="es">${quiz.chosen.map((k, j) => `<button class="tok" data-act="untok" data-j="${j}" ${quiz.answered ? "disabled" : ""}>${esc(q.tokens[k].t)}</button>`).join("")}</div>
      <div class="bank" lang="es">${q.tokens.map((tk, k) => `<button class="tok ${quiz.chosen.includes(k) ? "used" : ""}" data-act="tok" data-k="${k}" ${quiz.answered ? "disabled" : ""}>${esc(tk.t)}</button>`).join("")}</div>
      ${quiz.answered ? "" : `<button class="btn check" data-act="checkbuild" ${quiz.chosen.length ? "" : "disabled"}>تأكد</button>`}`;
    if (quiz.answered) fb = quiz.ok
      ? `<div class="feedback good" role="status"><b class="good-t">صحيح! مزيان</b>${nextBtn}</div>`
      : `<div class="feedback bad" role="status"><b class="bad-t">ماشي هي هادي</b><span>الجواب الصحيح: <b class="es" lang="es">${esc(q.answer)}</b></span>${nextBtn}</div>`;
  } else if (q.type === "ask") {
    const locked = quiz.answered || quiz.checking || quiz.selfPending;
    body = `<div class="prompt es" lang="es"><button class="say" data-act="say" data-t="${esc(q.q)}" aria-label="سمع السؤال">${SPEAK}</button><span>${esc(q.q)}</span></div>
      <p class="hint" style="margin:-12px 0 16px">${esc(q.hint)}</p>
      <form class="answer-form" id="askForm">
        <textarea id="ans" class="answer-input" rows="2" lang="es" dir="ltr" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe tu respuesta..." ${locked ? "disabled" : ""}>${esc(quiz.typed || "")}</textarea>
        ${locked ? "" : keysHTML("ans") + `<button class="btn" type="submit">${aiState === "on" ? "صحح ليا" : "تأكد"}</button>`}
      </form>`;
    if (locked) fb = askFeedback(q);
  } else {
    // name / type / listen
    let prompt = "";
    if (q.type === "name") prompt = `<div class="pic ${/^\d+$/.test(q.pic) ? "num" : ""}" role="img" aria-label="تصويرة">${esc(q.pic)}</div>`;
    else if (q.type === "type") prompt = `<div class="prompt">${esc(q.q)}</div>`;
    else prompt = `<div class="listen"><button class="listen-btn" data-act="say" data-t="${esc(q.answer)}" aria-label="سمع">${SPEAK}</button><span class="hint">كليكي باش تسمع مرة أخرى</span></div>`;
    const cls = quiz.answered ? (quiz.ok ? "right" : "wrong") : "";
    body = prompt + `<form class="answer-form" id="typeForm">
      <input id="ans" class="answer-input ${cls}" lang="es" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="كتب هنا بالإسبانية..." value="${esc(quiz.typed || "")}" ${quiz.answered ? "disabled" : ""}>
      ${quiz.answered ? "" : keysHTML("ans") + `<div class="actions" style="margin:0"><button class="btn" type="submit">تأكد</button><button class="btn ghost" type="button" data-act="giveup">ما عرفتش</button></div>`}
    </form>`;
    if (quiz.answered) fb = `<div class="feedback ${quiz.ok ? "good" : "bad"}" role="status">${typedFeedback(q)}${nextBtn}</div>`;
  }
  return `
  <div class="qtop"><button class="close" data-act="leave" aria-label="خرج">✕ خرج</button><span class="bar"><i style="width:${progress}%"></i></span><span class="count">${quiz.i + 1}/${n}</span></div>
  <div class="kind">${esc(q.kind)}</div>
  ${body}${fb}`;
}

function renderResult() {
  const n = quiz.qs.length, pct = Math.round(quiz.score / n * 100);
  const msg = pct === 100 ? "ممتاز! جاوبتي على كلشي صحيح." : pct >= 80 ? "مزيان بزاف، كمل هكا." : pct >= 50 ? "ماشي خايب. عاود التمرين باش تثبت." : "عاود قرا الشرح والكلمات، ومن بعد عاود التمرين.";
  return `
  <div class="result">
    <div class="score">${quiz.score}<small>/${n}</small></div>
    <h2>${pct}%</h2>
    <p>${msg}</p>
  </div>
  ${quiz.mistakes.length ? `<div class="review"><h3 class="sec">راجع هادو</h3><div class="vocab">${quiz.mistakes.map(m => `<div class="vrow"><button class="say" data-act="say" data-t="${esc(m.es)}" aria-label="سمع">${SPEAK}</button><span class="es" lang="es">${esc(m.es)}</span><span class="ar">${esc(m.ar)}</span></div>`).join("")}</div></div>` : ""}
  <div class="actions" style="margin-top:20px">
    <button class="btn" data-act="quiz" data-id="${quiz.lesson.id}">عاود التمرين</button>
    <button class="btn ghost" data-act="open" data-id="${quiz.lesson.id}">رجع للدرس</button>
  </div>`;
}

function renderCards() {
  if (!cards.queue.length) {
    return `<button class="back" data-act="open" data-id="${cards.lesson.id}">→ رجع للدرس</button>
      <div class="result"><div class="score">${cards.total}<small>/${cards.total}</small></div><h2>سالاو البطاقات</h2><p>عرفتي جميع الكلمات ديال هاد الدرس.</p></div>
      <div class="actions"><button class="btn" data-act="quiz" data-id="${cards.lesson.id}">دوز للتمرين</button><button class="btn ghost" data-act="cards" data-id="${cards.lesson.id}">عاود البطاقات</button></div>`;
  }
  const [es, ar] = cards.queue[0];
  return `
  <div class="qtop"><button class="close" data-act="open" data-id="${cards.lesson.id}">✕ خرج</button><span class="bar"><i style="width:${Math.round((cards.total - cards.queue.length) / cards.total * 100)}%"></i></span><span class="count">${cards.total - cards.queue.length}/${cards.total}</span></div>
  <button class="card" data-act="flip">
    <span class="front" lang="es">${esc(es)}</span>
    ${cards.flipped ? `<span class="back-t">${esc(ar)}</span>` : "<small>كليكي باش تشوف المعنى</small>"}
  </button>
  <div class="actions">
    <button class="btn ghost" data-act="say" data-t="${esc(es)}">سمع النطق</button>
    ${cards.flipped ? '<span></span>' : '<button class="btn ghost" data-act="flip">شوف المعنى</button>'}
  </div>
  ${cards.flipped ? `<div class="actions"><button class="btn" data-act="know">عرفتها</button><button class="btn ghost" data-act="again">عاودها</button></div>` : ""}`;
}

/* ============ المحادثة مع الأستاذ ============ */
function startChat(l) {
  const a = asksOf(l)[0];
  const opener = a
    ? { es: `¡Hola! Vamos a practicar «${l.es}». ${a[0]}`, ar: `مرحبا! يالاه نتمرنو على «${l.ar}». ${a[1]}` }
    : { es: `¡Hola! Vamos a practicar «${l.es}». ¿Cómo estás hoy?`, ar: `مرحبا! يالاه نتمرنو على «${l.ar}». كيداير اليوم؟` };
  chat = { lesson: l, msgs: [{ role: "tutor", ...opener }], busy: false, note: "" };
}

function chatPrompt() {
  const l = chat.lesson;
  const words = (l.vocab || []).slice(0, 14).map(v => v[0]).join(", ");
  const transcript = chat.msgs.slice(-12).map(m => m.role === "tutor" ? `Tutor: ${m.es}` : `Learner: ${m.text}`).join("\n");
  const last = chat.msgs[chat.msgs.length - 1].text;
  return `You are a warm, patient Spanish tutor having a written conversation with a Moroccan learner who speaks Darija.
Learner's level: CEFR ${levelName(l)}. Today's lesson: "${l.es}" (${l.ar}). Useful words from the lesson: ${words}.
Keep your Spanish simple and suited to that level. Stay on the lesson's topic, but follow the learner if they change subject.

Conversation so far:
${transcript}

Now respond to the learner's latest message: "${last}"
Reply with ONLY a JSON object:
{"ok": true if the learner's latest message is correct Spanish (ignore capital letters and missing ¿ ¡), "corrected": "the learner's latest message rewritten as correct natural Spanish keeping their meaning; empty string if ok", "tip": "Moroccan Darija in Arabic script, max 30 words: if there were mistakes explain the main one simply; if correct, a short encouragement. If they wrote in Darija, Arabic or French, give them the Spanish in corrected and tell them to try in Spanish", "reply": "your next message in Spanish: react briefly to what they said, then ask ONE new simple question on the topic. Max 25 words", "reply_ar": "Darija translation of reply, in Arabic script"}`;
}

async function sendChat(text) {
  if (!text.trim() || chat.busy) return;
  const me = { role: "me", text: text.trim(), fix: null };
  chat.msgs.push(me); chat.busy = true; chat.note = ""; chat.draft = "";
  render();
  try {
    const r = await sampleFn.json(chatPrompt(), { modelTier: "quick", cache: false });
    me.fix = { ok: !!r.ok, corrected: String(r.corrected || ""), tip: String(r.tip || "") };
    if (r.reply) chat.msgs.push({ role: "tutor", es: String(r.reply), ar: String(r.reply_ar || "") });
  } catch (e) {
    chat.note = aiErrorText(e);
  }
  chat.busy = false;
  if (view.name === "chat") render();
}

function renderChat() {
  const l = chat.lesson;
  const bubbles = chat.msgs.map((m, i) => {
    if (m.role === "tutor") return `<div class="bubble tutor">
      <p class="es" lang="es">${esc(m.es)}</p>
      <div class="bubble-tools"><button class="say" data-act="say" data-t="${esc(m.es)}" aria-label="سمع">${SPEAK}</button>${m.ar ? `<button class="linkish" data-act="tr" data-i="${i}">${m.showAr ? "خبي الترجمة" : "الترجمة"}</button>` : ""}</div>
      ${m.showAr ? `<p class="tr">${esc(m.ar)}</p>` : ""}</div>`;
    let fix = "";
    if (m.fix) {
      const same = !m.fix.corrected || clean(m.fix.corrected) === clean(m.text);
      fix = `<div class="fix ${m.fix.ok ? "good" : "bad"}">
        <b>${m.fix.ok ? "✓ مزيان" : "✎ التصحيح"}</b>
        ${!same ? `<span class="row-say"><button class="say" data-act="say" data-t="${esc(m.fix.corrected)}" aria-label="سمع">${SPEAK}</button><span class="es diff" lang="es">${diffHTML(m.text, m.fix.corrected)}</span></span>` : ""}
        ${m.fix.tip ? `<span>${esc(m.fix.tip)}</span>` : ""}</div>`;
    }
    return `<div class="bubble me"><p class="es" lang="es">${esc(m.text)}</p></div>${fix}`;
  }).join("");
  const off = aiState === "off";
  return `
  <div class="qtop"><button class="close" data-act="open" data-id="${l.id}">✕ خرج</button><span class="chat-title"><b>الأستاذ</b> · <span class="es" lang="es">${esc(l.es)}</span></span></div>
  <div class="chat">
    ${bubbles}
    ${chat.busy ? `<div class="bubble tutor typing"><span></span><span></span><span></span></div>` : ""}
    ${chat.note ? `<p class="err">${esc(chat.note)}</p>` : ""}
  </div>
  <div class="composer">
    <div class="composer-in">
      ${off ? `<p class="hint">المحادثة كتحتاج Claude باش يصحح. حل التطبيق من Claude وقبل الطلب ملي يبان ليك.</p>` : `
      ${keysHTML("chatIn")}
      <form id="chatForm" class="chat-form">
        <input id="chatIn" class="answer-input" lang="es" dir="ltr" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe en español..." ${chat.busy ? "disabled" : ""}>
        <button class="btn" type="submit" ${chat.busy ? "disabled" : ""}>صيفط</button>
      </form>`}
    </div>
  </div>`;
}

function render() {
  const draft = document.getElementById("chatIn");
  if (draft && chat) chat.draft = draft.value;
  let html = "";
  if (view.name === "home") html = renderHome();
  else if (view.name === "lesson") { const l = findLesson(view.id); html = l ? renderLesson(l) : renderHome(); }
  else if (view.name === "quiz") html = renderQuiz();
  else if (view.name === "result") html = renderResult();
  else if (view.name === "cards") html = renderCards();
  else if (view.name === "chat") html = renderChat();
  else if (view.name === "add") html = renderAdd();
  $app.innerHTML = html;
  if (view.name === "chat") {
    const inp = document.getElementById("chatIn");
    if (inp) { inp.value = chat.draft || ""; if (!chat.busy) inp.focus({ preventScroll: true }); }
    window.scrollTo(0, document.body.scrollHeight);
  }
  if (view.name === "quiz" && !quiz.answered && !quiz.checking) {
    const a = document.getElementById("ans");
    if (a && !a.disabled) a.focus({ preventScroll: true });
  }
}

/* ============ الأحداث ============ */
function finishAnswer(ok, q) {
  quiz.answered = true; quiz.ok = ok;
  if (ok) quiz.score++;
  else {
    let es, ar;
    if (q.type === "mcq") { es = q.optEs ? q.answer : q.q; ar = q.optEs ? q.q : q.answer; }
    else if (q.type === "fill") { es = q.q.replace("___", q.answer); ar = "(" + q.answer + ")"; }
    else if (q.type === "ask") { es = (quiz.ai && quiz.ai.corrected) || q.example; ar = q.hint; }
    else if (q.type === "build") { es = q.answer; ar = q.q; }
    else { es = q.answer; ar = q.ar || ""; }
    quiz.mistakes.push({ es, ar });
  }
  render();
}

function nextQuestion() {
  if (quiz.i < quiz.qs.length - 1) {
    quiz.i++;
    Object.assign(quiz, { answered: false, chosen: [], picked: null, typed: "", verdict: null, ai: null, aiMsg: "", checking: false, selfPending: false });
    render(); window.scrollTo(0, 0);
    const q = quiz.qs[quiz.i];
    if (q.type === "listen") speak(q.answer);
  } else {
    const pct = Math.round(quiz.score / quiz.qs.length * 100);
    scores[quiz.lesson.id] = Math.max(pct, scores[quiz.lesson.id] || 0); store.set("aula.scores", scores);
    go({ name: "result" });
  }
}

async function submitAsk(text) {
  const q = quiz.qs[quiz.i];
  quiz.typed = text;
  if (aiState === "on") {
    quiz.checking = true; render();
    try {
      const r = await aiCheckAnswer(quiz.lesson, q, text);
      quiz.ai = { ok: !!r.ok, corrected: String(r.corrected || ""), tip: String(r.tip || "") };
      quiz.checking = false;
      finishAnswer(quiz.ai.ok, q);
      return;
    } catch (e) {
      quiz.checking = false;
      quiz.aiMsg = aiErrorText(e);
    }
  }
  quiz.selfPending = true;
  render();
}

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== "del") pendingDelete = null;
  switch (act) {
    case "home": go({ name: "home" }); break;
    case "level": level = id; store.set("aula.level", level); render(); break;
    case "open": go({ name: "lesson", id }); break;
    case "add": go({ name: "add" }); break;
    case "edit": go({ name: "add", editId: id }); break;
    case "say": speak(b.dataset.t); break;
    case "key": {
      const t = document.getElementById(b.dataset.target);
      if (t && !t.disabled) { t.focus(); t.setRangeText(b.dataset.k, t.selectionStart, t.selectionEnd, "end"); }
      break;
    }
    case "quiz": {
      const l = findLesson(id);
      quiz = { lesson: l, qs: makeQuiz(l), i: 0, score: 0, answered: false, chosen: [], mistakes: [], typed: "" };
      go({ name: "quiz" });
      if (quiz.qs[0] && quiz.qs[0].type === "listen") speak(quiz.qs[0].answer);
      break;
    }
    case "leave": go({ name: "lesson", id: quiz.lesson.id }); break;
    case "pick": { const q = quiz.qs[quiz.i]; quiz.picked = +b.dataset.i; finishAnswer(q.options[quiz.picked] === q.answer, q); break; }
    case "tok": quiz.chosen.push(+b.dataset.k); render(); break;
    case "untok": quiz.chosen.splice(+b.dataset.j, 1); render(); break;
    case "checkbuild": { const q = quiz.qs[quiz.i]; const said = quiz.chosen.map(k => q.tokens[k].t).join(" "); finishAnswer(said === q.answer, q); break; }
    case "giveup": { const q = quiz.qs[quiz.i]; quiz.typed = ""; quiz.verdict = { ok: false }; finishAnswer(false, q); break; }
    case "self": { const q = quiz.qs[quiz.i]; quiz.selfPending = false; finishAnswer(b.dataset.ok === "1", q); break; }
    case "next": nextQuestion(); break;
    case "chat": startChat(findLesson(id)); go({ name: "chat" }); break;
    case "tr": { const m = chat.msgs[+b.dataset.i]; m.showAr = !m.showAr; render(); break; }
    case "cards": { const l = findLesson(id); cards = { lesson: l, queue: shuffle(l.vocab.slice()), total: l.vocab.length, flipped: false }; go({ name: "cards" }); break; }
    case "flip": if (!cards.flipped) { cards.flipped = true; speak(cards.queue[0][0]); render(); } break;
    case "know": cards.queue.shift(); cards.flipped = false; render(); break;
    case "again": cards.queue.push(cards.queue.shift()); cards.flipped = false; render(); break;
    case "del":
      if (pendingDelete === id) {
        mine = mine.filter(l => l.id !== id); store.set("aula.mine", mine);
        delete scores[id]; store.set("aula.scores", scores); pendingDelete = null; go({ name: "home" });
      } else { pendingDelete = id; render(); }
      break;
  }
});

$app.addEventListener("keydown", e => {

$app.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  if (form.id === "typeForm") {
    const val = document.getElementById("ans").value;
    if (!val.trim()) return;
    const q = quiz.qs[quiz.i];
    quiz.typed = val; quiz.verdict = judge(val, q.answer);
    finishAnswer(quiz.verdict.ok, q);
    return;
  }
  if (form.id === "askForm") {
    const val = document.getElementById("ans").value;
    if (val.trim()) submitAsk(val.trim());
    return;
  }
  if (form.id === "chatForm") {
    const inp = document.getElementById("chatIn");
    const val = inp.value; inp.value = "";
    sendChat(val);
    return;
  }
  const err = document.getElementById("f-err");
  const title = document.getElementById("f-title").value.trim();
  const ar = document.getElementById("f-ar").value.trim();
  const lv = document.getElementById("f-level").value;
  const parsed = parseMine(document.getElementById("f-text").value);
  if (!title) { err.textContent = "كتب العنوان ديال الدرس."; err.hidden = false; return; }
  if (parsed.vocab.length + parsed.build.length < 2) { err.textContent = "زيد على الأقل جوج سطور بهاد الشكل: rojo = حمر"; err.hidden = false; return; }
  const lesson = { id: view.editId || "mine-" + Date.now(), level: lv, es: title, ar: ar || "درس من الفيديو", note: [], mine: true, ...parsed };
  if (view.editId) mine = mine.map(l => l.id === view.editId ? lesson : l); else mine.push(lesson);
  store.set("aula.mine", mine);
  level = lv; store.set("aula.level", level);
  go({ name: "lesson", id: lesson.id });
});

render();
</script>
